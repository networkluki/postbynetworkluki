<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="{{ description }}">
  <meta name="theme-color" content="#26292E">
  <title>{{ title }}</title>
  <link rel="stylesheet" href="{{ stylesheet }}">
  <link rel="alternate" type="application/rss+xml" title="Post by networkluki" href="/feed.xml">
  <!-- Favicons (same icon set as lukihackwell.com) -->
  <link rel="apple-touch-icon" sizes="57x57" href="/static/icons/apple-icon-57x57.png">
  <link rel="apple-touch-icon" sizes="60x60" href="/static/icons/apple-icon-60x60.png">
  <link rel="apple-touch-icon" sizes="72x72" href="/static/icons/apple-icon-72x72.png">
  <link rel="apple-touch-icon" sizes="76x76" href="/static/icons/apple-icon-76x76.png">
  <link rel="apple-touch-icon" sizes="114x114" href="/static/icons/apple-icon-114x114.png">
  <link rel="apple-touch-icon" sizes="120x120" href="/static/icons/apple-icon-120x120.png">
  <link rel="apple-touch-icon" sizes="144x144" href="/static/icons/apple-icon-144x144.png">
  <link rel="apple-touch-icon" sizes="152x152" href="/static/icons/apple-icon-152x152.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/icons/apple-icon-180x180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/static/icons/android-icon-192x192.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="96x96" href="/static/icons/favicon-96x96.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/static/icons/favicon-16x16.png">
  <link rel="shortcut icon" href="/static/icons/favicon.ico" type="image/x-icon">
  <link rel="icon" href="/static/icons/favicon.ico" type="image/x-icon">
  <link rel="manifest" href="/static/icons/manifest.json">
  <meta name="msapplication-TileColor" content="#26292E">
  <meta name="msapplication-TileImage" content="/static/icons/ms-icon-144x144.png">
  <meta name="msapplication-config" content="/static/icons/browserconfig.xml">
  <script src="/static/theme-init.js"></script>
</head>
<body>
  <div class="theme-switch">
    <button type="button" id="themeSwitch" class="theme-switch__btn" role="switch" aria-checked="false" aria-label="Toggle light and dark theme">
      <svg class="theme-switch__icon theme-switch__icon--sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
      <svg class="theme-switch__icon theme-switch__icon--moon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <span class="theme-switch__knob"></span>
    </button>
  </div>

  <header class="site-header">
    <a class="brand" href="/" aria-label="Post by networkluki, home"><span>post</span><small>by networkluki</small></a>
    <nav class="site-nav" aria-label="Sections"><a href="/blog">Articles</a><a href="/changelog">Changelog</a><a href="/ideas">Ideas</a><a href="/quotes">Quotes</a><a href="/feed.xml">RSS</a><a class="site-nav__ext" href="https://lukihackwell.com/">Home</a></nav>
  </header>

  <main>{{ content }}</main>

  <footer class="site-footer">
    <div class="footer-version">v1.3.4</div>
    <div class="footer-status">
      <span class="high"><strong>1</strong> high</span>
      <span class="medium"><strong>3</strong> medium</span>
      <span class="low"><strong>4</strong> low</span>
    </div>
    <div class="footer-copyright">&copy; <span id="current-year"></span> networkluki.com</div>
    <div class="footer-left"><a id="latest-diff" href="https://github.com/networkluki/postbynetworkluki/commits/main" target="_blank" rel="noopener noreferrer">version</a></div>
    <div class="footer-right"><span id="years-left"></span> Years left</div>
  </footer>

  <script src="/static/theme-switch.js"></script>
  <script src="/static/year.js"></script>
  <script src="/static/age.js"></script>
</body>
</html>
